<style>
  :root {
    --width: 720px;
    --font-main: Verdana, sans-serif;
    --font-secondary: Verdana, sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
    /* BEGIN CUSTOM: matiasilva custom accent colors */
    --accent-name: #1a3a52;
    --accent-nav: #8b8680;
    /* END CUSTOM */
  }

  /* BEGIN CUSTOM: matiasilva - force light theme permanently */
  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fff;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #3273dc;
      --visited-color: #8b6fcb;
      --blockquote-color: #222;
    }
  }
  /* END CUSTOM */

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: underline; /* CUSTOM: matiasilva - underline all links */
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  /* BEGIN CUSTOM: matiasilva - custom header, nav, and footer styling */
  main h2 {
    font-size: 1.3em;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 2em;
  }

  header .site-title-link {
    text-decoration: none;
  }

  header .site-title {
    color: var(--accent-name);
    font-weight: 600;
    margin: 0;
  }

  header .site-title-link:hover .site-title {
    opacity: 0.7;
  }

  nav a {
    color: var(--accent-nav);
    font-weight: 400;
    text-transform: lowercase;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  nav a:hover {
    opacity: 0.7;
  }

  footer {
    font-size: 0.9em;
    color: var(--accent-nav);
    border-top: 4px solid #eee;
    margin-top: 2em;
    padding-top: 1em;
    overflow: hidden;
  }

  .footer-column {
    color: var(--accent-nav);
    float: left;
    margin-right: 3em;
  }

  .footer-column a {
    font-size: 80%;
    color: #8085C1;
  }

  .footer-column a:hover {
    opacity: 0.7;
  }
  /* END CUSTOM */

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* BEGIN CUSTOM: matiasilva - blog post list styling */
  ul.blog-posts {
    list-style-type: none;
    line-height: 1.75em;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    color: #aaa;
    font-family: Monaco, "Courier New", monospace;
    font-size: 80%;
    font-weight: 400;
    margin-right: 1em;
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }
  /* END CUSTOM */

  /* BEGIN CUSTOM: matiasilva - project links */
  .project-links {
    margin: 1.5em 0;
    padding: 1em;
    background-color: #f8f8f8;
    border-radius: 4px;
  }

  .project-links a {
    margin-right: 1.5em;
    font-weight: 500;
  }
  /* END CUSTOM */

  /* BEGIN CUSTOM: matiasilva - blog post meta footer */
  .post-meta {
    color: var(--accent-nav);
    font-size: 0.9em;
    font-style: italic;
    margin-top: 2em;
  }
  /* END CUSTOM */

</style>
